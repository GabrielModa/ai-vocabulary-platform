name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_API_URL: http://localhost:3001
  EXPO_PUBLIC_APP_ENV: test
  EXPO_PUBLIC_API_URL: http://localhost:3001
  ADMIN_APP_ENV: test
  ADMIN_API_URL: http://localhost:3001
  DATABASE_URL: postgresql://test:test@localhost:5432/test

jobs:
  quality:
    name: Reproducible quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          run_install: false

      - name: Set up Node.js with lockfile cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local-parity quality gates
        run: pnpm ci:quality

      - name: Create non-sensitive summary
        if: always()
        run: |
          mkdir -p reports
          node -e 'process.stdout.write(JSON.stringify({commit: process.env.GITHUB_SHA, gate: "quality", result: "completed"}) + "\n")' > reports/quality-summary.json

      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-summary
          path: reports/quality-summary.json
          retention-days: 7

  security:
    name: Dependency, secret, and source security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          run_install: false

      - name: Set up Node.js with lockfile cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository policy and secret scan
        run: pnpm ci:security

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
